name: "Mise Elixir Cache"
description: "Cache Mix deps/_build, clean on retry, and fetch dependencies"
inputs:
  mix-env:
    description: "MIX_ENV value for cache key segmentation"
    required: true
  deps-get-args:
    description: "Additional arguments for mix deps.get (e.g. '--only prod')"
    required: false
    default: ""
branding:
  icon: "droplet"
  color: "purple"
runs:
  using: "composite"
  steps:
    - name: Detect Elixir and Erlang versions
      id: tool-versions
      shell: bash
      run: |
        set -euo pipefail

        version_for() {
          local tool="$1"
          local version

          version="$(mise current "$tool" 2>/dev/null || true)"
          version="${version//$'\r'/}"
          version="${version//$'\n'/}"

          if [ -z "$version" ]; then
            version="unknown"
          fi

          printf '%s' "$version" | tr -cs '[:alnum:]._=+-' '-'
        }

        echo "erlang=$(version_for erlang)" >> "$GITHUB_OUTPUT"
        echo "elixir=$(version_for elixir)" >> "$GITHUB_OUTPUT"

    - uses: actions/cache@v5
      id: mix-cache
      with:
        path: |
          deps
          _build/${{ inputs.mix-env }}/lib
          _build/${{ inputs.mix-env }}/phoenix-colocated
        key: ${{ runner.os }}-${{ inputs.mix-env }}-erlang-${{ steps.tool-versions.outputs.erlang }}-elixir-${{ steps.tool-versions.outputs.elixir }}-mise-${{ hashFiles('**/mise.toml') }}-mix-${{ hashFiles('**/mix.lock') }}
        restore-keys: |
          ${{ runner.os }}-${{ inputs.mix-env }}-erlang-${{ steps.tool-versions.outputs.erlang }}-elixir-${{ steps.tool-versions.outputs.elixir }}-mise-${{ hashFiles('**/mise.toml') }}-mix-
    # Cache Hex registry and Mix archives to avoid network round-trips to hex.pm
    # Must be restored BEFORE "Clean on retry" which needs Hex to parse mix.exs
    - name: Restore Hex/Mix home cache
      uses: actions/cache@v5
      with:
        path: |
          ~/.hex
          ~/.mix
        key: hex-mix-home-${{ runner.os }}-${{ hashFiles('**/mise.toml') }}
    - name: Clean on retry
      if: github.run_attempt > 1
      shell: bash
      run: |
        mix local.hex --force --if-missing
        mix local.rebar --force --if-missing
        mix deps.clean --all
        mix clean
    # Always run deps.get: it installs Hex/rebar (not cached) and is fast (~1s) on cache hit
    - shell: bash
      env:
        DEPS_GET_ARGS: ${{ inputs.deps-get-args }}
      run: mix deps.get $DEPS_GET_ARGS
